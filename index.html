<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SĐBS CI LPBank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: shell iPTI — sidebar điều hướng trái, header breadcrumb, một card trắng chứa stepper và nội dung, thanh hành động cố định dưới */
:root{
  --brand:#0b3c8d; --brand-2:#1668c4; --brand-s:#eaf1fb;
  --primary:#f58220; --primary-d:#d96d12;
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#fafafa; --surface-3:#f0f1f4;
  --line:#e2e4ea; --line-2:#c9cdd6;
  --fg:#1f2430; --fg-2:#5a6072; --fg-3:#8b91a1;
  --ok:#0f7b52; --ok-s:#e9f6f0;
  --warn:#9a5b00; --warn-s:#fdf4e4;
  --danger:#c0392b; --danger-s:#fdeeec;
  --info:#1668c4; --info-s:#eaf2fc;
  --r:8px; --r-s:6px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-l:0 8px 28px -18px rgba(16,24,40,.4);
  --fu:'Be Vietnam Pro',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --brand:#7aa7e8; --brand-2:#8fb8f0; --brand-s:#152235;
  --primary:#f89440; --primary-d:#ffa868;
  --bg:#101319; --surface:#181c24; --surface-2:#1e232c; --surface-3:#252b36;
  --line:#2c323d; --line-2:#3d4553;
  --fg:#e9ecf2; --fg-2:#a4abba; --fg-3:#777f90;
  --ok:#4ec08c; --ok-s:#12271e;
  --warn:#e0a44a; --warn-s:#2a2113;
  --danger:#ef8278; --danger-s:#2c1917;
  --info:#6fb0ee; --info-s:#13202e;
  --shadow:0 1px 2px rgba(0,0,0,.45);
  --shadow-l:0 8px 28px -18px rgba(0,0,0,.9);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand:#7aa7e8; --brand-2:#8fb8f0; --brand-s:#152235;
  --primary:#f89440;
  --bg:#101319; --surface:#181c24; --surface-2:#1e232c; --surface-3:#252b36;
  --line:#2c323d; --line-2:#3d4553;
  --fg:#e9ecf2; --fg-2:#a4abba; --fg-3:#777f90;
  --ok:#4ec08c; --ok-s:#12271e;
  --warn:#e0a44a; --warn-s:#2a2113;
  --danger:#ef8278; --danger-s:#2c1917;
  --info:#6fb0ee; --info-s:#13202e;
  --shadow:0 1px 2px rgba(0,0,0,.45);
  --shadow-l:0 8px 28px -18px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fu);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.005em}
button{font:inherit;color:inherit}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:1px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hid{display:none!important}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)}
.sm{font-size:12.5px}
.sp{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}

/* ============ shell ============ */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.app.collapsed{grid-template-columns:64px minmax(0,1fr)}
@media (max-width:860px){.app,.app.collapsed{grid-template-columns:minmax(0,1fr)}}

.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;align-self:start;height:100vh;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
@media (max-width:860px){.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
.logo{height:62px;display:flex;align-items:center;gap:9px;padding:0 20px;flex:none}
.logo .lm{width:30px;height:30px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none;
  font-weight:700;font-size:11px;letter-spacing:.04em}
.logo .lm b{color:var(--primary)}
.logo .lt{font-weight:700;font-size:17px;color:var(--brand);letter-spacing:-.02em}
.app.collapsed .logo{padding:0 17px}
.app.collapsed .logo .lt,.app.collapsed .nav .tx,.app.collapsed .nav .cv{display:none}
.nav{padding:6px 10px;flex:1;overflow-y:auto}
.nav a,.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:0;background:transparent;
  border-radius:var(--r-s);cursor:pointer;color:var(--fg-2);font-size:13.5px;font-weight:500;text-align:left;margin-bottom:2px}
.nav button:hover{background:var(--surface-3);color:var(--fg)}
.nav button.on{background:var(--brand-s);color:var(--brand-2);font-weight:600}
.nav .ic{width:17px;height:17px;flex:none;opacity:.8}
.nav .sub{padding-left:28px}
.nav .sub{padding-left:28px;font-size:13px}
.nav .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);padding:14px 11px 5px;font-weight:700}
.side .tog{border-top:1px solid var(--line);padding:9px 14px;flex:none}
.side .tog button{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--fg-3);cursor:pointer;
  font-size:12.5px;padding:5px;border-radius:var(--r-s)}
.side .tog button:hover{background:var(--surface-3);color:var(--fg)}

.main{min-width:0;display:flex;flex-direction:column}
.head{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:16px;
  flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
@media (max-width:560px){.head{padding:12px 16px}}
.crumb{font-size:12.5px;color:var(--fg-3)}
.crumb b{color:var(--fg-2);font-weight:500}
.head h1{font-size:19px;margin-top:1px}
.head .usr{display:flex;align-items:center;gap:9px}
.head .av{width:30px;height:30px;border-radius:50%;background:var(--brand-s);color:var(--brand-2);display:grid;place-items:center;
  font-weight:700;font-size:12px;flex:none}
.iconbtn{width:32px;height:32px;border-radius:var(--r-s);border:1px solid transparent;background:transparent;color:var(--fg-2);
  cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface-3);color:var(--fg)}
.content{padding:20px 24px 96px;width:100%;min-width:0}
@media (max-width:560px){.content{padding:16px 16px 110px}}

/* ============ card / stepper ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card > .cb{padding:22px 24px}
@media (max-width:560px){.card > .cb{padding:16px}}
.card > .ch{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card > .ch h3{font-size:15px}

.steps{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line);gap:0;overflow-x:auto}
.steps .st{display:flex;align-items:center;gap:9px;flex:none;color:var(--fg-3);font-size:13.5px;font-weight:500;
  background:none;border:0;padding:0;cursor:default}
.steps .st[data-go]{cursor:pointer}
.steps .st .n{width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--fg-3);display:grid;place-items:center;
  font-size:12px;font-weight:600;flex:none}
.steps .st.on{color:var(--fg);font-weight:600}
.steps .st.on .n{background:var(--brand);color:#fff}
.steps .st.dn{color:var(--fg-2)}
.steps .st.dn .n{background:var(--brand);color:#fff}
.steps .ln{flex:1;height:1px;background:var(--line);margin:0 16px;min-width:24px}

/* ============ sections & fields ============ */
.sec{padding-top:22px;margin-top:22px;border-top:1px solid var(--line)}
.sec:first-child{padding-top:0;margin-top:0;border-top:0}
.sec > h4{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 20px}
.fl{min-width:0}
.fl > label,.fl > .lb{display:block;font-size:13px;color:var(--fg-2);margin-bottom:5px;font-weight:500}
.fl .rq{color:var(--danger);margin-right:3px}
.fl .ro{font-size:13.5px;font-weight:500;color:var(--fg);word-break:break-word;padding-top:1px}
.fl .ro.mono{font-family:var(--fm)}
input[type=text],input[type=email],input[type=date],select{width:100%;height:38px;padding:0 11px;border:1px solid var(--line-2);
  border-radius:var(--r-s);background:var(--surface);color:var(--fg);font-size:13.5px}
input:hover:not(:disabled),select:hover:not(:disabled){border-color:var(--brand-2)}
input:focus,select:focus{border-color:var(--brand-2);box-shadow:0 0 0 2px var(--brand-s);outline:none}
input:disabled,select:disabled{background:var(--surface-3);color:var(--fg-3);cursor:not-allowed;border-color:var(--line)}
input.bad{border-color:var(--danger)}
input.bad:focus{box-shadow:0 0 0 2px var(--danger-s)}

.was{margin-top:5px;font-size:12.5px;color:var(--fg-3)}
.was s{color:var(--fg-3)}
.was b{color:var(--ok);font-weight:600}
.err{margin-top:5px;font-size:12.5px;color:var(--danger)}

/* ============ atoms ============ */
.btn{height:38px;padding:0 18px;border-radius:var(--r-s);border:1px solid transparent;background:var(--primary);color:#fff;
  font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--primary-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gh{background:transparent;border-color:var(--line-2);color:var(--fg)}
.btn.gh:hover{border-color:var(--brand-2);color:var(--brand-2);background:transparent}
.btn.bl{background:var(--brand);color:#fff}
.btn.bl:hover{background:var(--brand-2)}
.btn.sm{height:32px;padding:0 13px;font-size:13px}
.btn.lk{background:transparent;border:0;color:var(--brand-2);padding:0 4px;height:auto;font-weight:600}
.btn.lk:hover{background:transparent;text-decoration:underline}
.btn.dn{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.dn:hover{background:var(--danger-s)}

.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:4px;font-size:12px;font-weight:600;
  border:1px solid transparent;white-space:nowrap}
.tag.g{background:var(--ok-s);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 22%,transparent)}
.tag.o{background:var(--warn-s);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 22%,transparent)}
.tag.r{background:var(--danger-s);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 22%,transparent)}
.tag.b{background:var(--info-s);color:var(--info);border-color:color-mix(in srgb,var(--info) 22%,transparent)}
.tag.n{background:var(--surface-3);color:var(--fg-3);border-color:var(--line)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.alert{display:flex;gap:10px;padding:11px 14px;border-radius:var(--r-s);font-size:13.5px;border:1px solid transparent;align-items:flex-start}
.alert .ai{flex:none;width:17px;height:17px;margin-top:1px}
.alert.g{background:var(--ok-s);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 22%,transparent)}
.alert.o{background:var(--warn-s);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 22%,transparent)}
.alert.r{background:var(--danger-s);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 22%,transparent)}
.alert.b{background:var(--info-s);color:var(--info);border-color:color-mix(in srgb,var(--info) 22%,transparent)}
.alert b{font-weight:700}

.cbx{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:13.5px;color:var(--fg)}
.cbx input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;flex:none;margin:0}
.cbx input:disabled{cursor:not-allowed}
.cbx.al{align-items:flex-start}
.cbx.al input{margin-top:3px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-s)}
.tw th.n,.tw td.n{white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:460px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--fg-2);font-weight:600;background:var(--surface-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font-family:var(--fm)}
td.mono{white-space:nowrap}
tr.tt td{background:var(--surface-2);font-weight:700}

/* ============ cụm sửa đổi ============ */
.cl{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.cl + .cl{margin-top:12px}
.cl.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-s)}
.cl.off{opacity:.72}
.cl > .h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.cl > .h .t{font-size:14px;font-weight:600}
.cl > .b{padding:16px}
.sub{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.sub:first-child{border-top:0;margin-top:0;padding-top:0}
.sub > h5{margin:0 0 11px;font-size:12.5px;font-weight:600;color:var(--fg-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.per{border:1px solid var(--line);border-radius:var(--r-s);padding:14px 16px;background:var(--surface)}
.per + .per{margin-top:10px}
.per.on{border-color:var(--brand-2);background:var(--brand-s)}
.per.on > .b{background:var(--surface);margin:12px -16px -14px;padding:14px 16px;border-top:1px solid var(--line)}
.per > .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.per > .h .nm{font-weight:600;font-size:13.5px}

/* ============ upload ============ */
.ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.up{border:1px dashed var(--line-2);border-radius:var(--r-s);padding:16px 12px;background:var(--surface-2);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:104px;color:var(--fg-2);text-align:center}
.up:hover{border-color:var(--brand-2);color:var(--brand-2)}
.up.ok{border-style:solid;border-color:var(--ok);background:var(--ok-s);color:var(--ok)}
.up .t{font-size:13px;font-weight:600}
.up .s{font-size:11.5px;color:var(--fg-3)}
.up.ok .s{color:var(--ok)}

/* ============ timeline theo dõi ============ */
.ms{display:grid;grid-template-columns:26px minmax(0,1fr);gap:14px;padding-bottom:22px;position:relative}
.ms:last-child{padding-bottom:0}
.ms:not(:last-child)::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.ms.dn:not(:last-child)::before{background:var(--ok)}
.ms .bl{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--fg-3);z-index:1}
.ms.dn .bl{background:var(--ok);border-color:var(--ok);color:#fff}
.ms.rn .bl{border-color:var(--primary);color:var(--primary)}
.ms .ti{font-size:14px;font-weight:600;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.ms .ds{font-size:13px;color:var(--fg-2);margin-top:2px}
.ms .ac{margin-top:9px}

.fil{display:flex;gap:11px;align-items:center;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface-2);flex-wrap:wrap}
.fil + .fil{margin-top:8px}
.fil .ico{width:26px;height:32px;border-radius:3px;background:var(--surface);border:1px solid var(--line-2);position:relative;flex:none}
.fil .ico::after{content:"PDF";position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:6.5px;font-weight:700;color:var(--danger);font-family:var(--fm)}
.fil .nm{font-size:13.5px;font-weight:500;min-width:0}
.fil .mt{font-size:12px;color:var(--fg-3);font-family:var(--fm)}

details.log{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface-2)}
details.log > summary{padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--fg-2);list-style:none}
details.log > summary::-webkit-details-marker{display:none}
details.log > summary::before{content:"▸ ";color:var(--fg-3)}
details.log[open] > summary::before{content:"▾ "}
details.log .lg{padding:0 14px 12px;font-size:12.5px;color:var(--fg-2)}
details.log .lg div{padding:3px 0;border-top:1px dashed var(--line)}

/* ============ bottom bar ============ */
.bar{position:fixed;left:232px;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 24px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.app.collapsed .bar{left:64px}
@media (max-width:860px){.bar{left:0}}
@media (max-width:560px){.bar{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
.bar .inf{font-size:13px;color:var(--fg-2)}
.bar .inf b{color:var(--fg);font-family:var(--fm)}

/* ============ QR ============ */
.qr{width:150px;height:150px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-s);padding:9px;flex:none}
.qr .g{width:100%;height:100%;display:grid;grid-template-columns:repeat(25,1fr);grid-template-rows:repeat(25,1fr)}
.cd{font-family:var(--fm);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

/* ============ màn khách hàng ============ */
.khwrap{display:flex;justify-content:center;padding:24px 16px 110px}
.phone{width:372px;max-width:100%;border:9px solid #16181d;border-radius:36px;background:var(--surface);overflow:hidden;
  box-shadow:var(--shadow-l)}
.phone .nt{height:22px;background:#16181d;position:relative}
.phone .nt::after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:3px;width:88px;height:15px;border-radius:999px;background:#000}
.phone .sc{height:636px;overflow-y:auto;background:var(--surface-2);display:flex;flex-direction:column}
.phone .sc > .kb{flex:1}
.kh{background:var(--brand);color:#fff;padding:15px 16px 17px}
.kh .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.82;font-weight:600}
.kh .t{font-size:16px;font-weight:700;margin-top:2px}
.kh .m{font-size:11.5px;opacity:.88;font-family:var(--fm);margin-top:3px}
.kb{padding:14px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:13px 14px}
.kc + .kc{margin-top:11px}
.kc > h5{margin:0 0 9px;font-size:12px;font-weight:700;color:var(--fg-2);text-transform:uppercase;letter-spacing:.05em}
.kr{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0}
.kr .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.kd{padding:8px 0;border-bottom:1px dashed var(--line)}
.kd:last-child{border-bottom:0}
.kd .l{font-size:11.5px;color:var(--fg-3);font-weight:500}
.ka{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:8px}
.kbt{width:100%;height:46px;border-radius:var(--r-s);border:0;background:var(--primary);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer}
.kbt:disabled{opacity:.42;cursor:not-allowed}
.kbt.gh{background:transparent;border:1px solid var(--line-2);color:var(--fg-2)}
.otp{display:flex;gap:8px;justify-content:center;margin:16px 0}
.otp input{width:40px;height:48px;text-align:center;font-size:19px;font-family:var(--fm);font-weight:600;padding:0}
.tabs{display:flex;gap:3px;background:var(--surface-3);padding:3px;border-radius:var(--r-s);margin-bottom:12px}

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var fmt=function(n){return (n||0).toLocaleString('vi-VN')};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})};
var fid=function(p){return 'f-'+p.replace(/\./g,'__')};
var pid=function(p){return p.replace(/\./g,'__')};

/* ---------- ngày / tuổi ---------- */
var TODAY=new Date(2026,9,14);
function pd(s){var a=s.split('/').map(Number);return new Date(a[2],a[1]-1,a[0])}
function fd(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromIso(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function hhmm(h){var t=new Date(TODAY.getTime());t.setHours(10,15,0,0);t=new Date(t.getTime()+h*3600000);
 return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+' '+fd(t)}
function cutoff(){return '23:59 '+fd(TODAY)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function get(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k]},o)}
function set(o,p,v){var k=p.split('.'),l=k.pop();k.reduce(function(a,x){return a[x]},o)[l]=v}
function tuoiAt(ns,at){var d=pd(ns),t=at.getFullYear()-d.getFullYear();
 var m=at.getMonth()-d.getMonth();if(m<0||(m===0&&at.getDate()<d.getDate()))t--;return t}
function tuoi(ns){return tuoiAt(ns,TODAY)}

/* ---------- biểu phí CI ---------- */
/* Tỷ lệ tổng phí theo độ tuổi — gói 4. Phí chỉ phụ thuộc tuổi, không phụ thuộc giới tính. */
var BANDS=[[1,18,'01-18',0.270],[19,25,'19-25',0.345],[26,30,'26-30',0.435],[31,35,'31-35',0.690],
 [36,40,'36-40',1.170],[41,45,'41-45',1.830],[46,50,'46-50',2.640],[51,55,'51-55',3.600],
 [56,60,'56-60',5.055],[61,65,'61-65',8.535],[66,70,'66-70',11.172]];
var AGE_MIN=1,AGE_MAX=70;
function bandOf(t){for(var i=0;i<BANDS.length;i++)if(t>=BANDS[i][0]&&t<=BANDS[i][1])return BANDS[i];return null}
function band(t){var b=bandOf(t);return b?b[2]:null}
function tyLePhi(t){var b=bandOf(t);return b?b[3]:null}

function diffList(b,d,F){var o=[];

  o.push({g:'Bên mua bảo hiểm',l:c.l,o:c.o,n:c.n})});
 if(S.cl.ndbh)diffList(S.base.ndbh,S.draft.ndbh,flNdbh()).forEach(function(c){

  if(!b){o.push({g:'Người thụ hưởng '+(i+1),l:'Thêm mới',o:'(không có)',n:tenOf(d)||'(chưa nhập)'});return}

function docsIn(pre){
 var ds=docsOf(pre);if(!ds.length)return '';
 var cf=[];ds.forEach(function(dc){dc.cmp.forEach(function(f){if(cf.indexOf(f[1])<0)cf.push(f[1])})});
 var h='<div class="sub"><h5>Ảnh giấy tờ gốc — bắt buộc đối chiếu OCR khi sửa đổi</h5>'+
  '<div class="sm muted" style="margin:-4px 0 11px">'+
  (cf.length?'Hệ thống đối chiếu trường vừa sửa: <b>'+esc(cf.join(', '))+'</b>.'
   :'Không có trường nào trên giấy tờ bị sửa — ảnh chỉ lưu vào hồ sơ.')+'</div>';
 ds.forEach(function(dc){var tr=docTruth(dc),dec=ocrState()?dc.d:null;
  h+='<div class="idwrap">';
  for(var i=0;i<dc.n;i++){var key=dc.id+'-'+i,
   lbl=dc.type==='CCCD/Căn cước'?(i===0?'Mặt trước':'Mặt sau'):'Ảnh giấy khai sinh';
   h+= S.docs[key]?idCard(tr,i===0?'front':'back',dec,dc.type)
    :'<div class="up"'+(S.locked?'':' data-up="'+key+'" role="button" tabindex="0"')+'>'+
     '<div class="t">+ '+esc(lbl)+'</div><div class="s">Bấm để tải ảnh</div></div>'}
  h+='</div>'});
 var st=ocrState();
 if(st==='ok')h+='<div class="alert g mt12"><span class="ai">✓</span><div>Ảnh khớp 100% với nội dung sửa đổi.</div></div>';
 if(st==='bad'){
  var ids={};ds.forEach(function(x){ids[x.who]=1});
  var bad=ocrRows().filter(function(r){return !r.ok&&ids[r.d]});
  if(bad.length)h+='<div class="alert r mt12"><span class="ai">✕</span><div>Nội dung khai báo không khớp giấy tờ gốc.</div></div>'+
   '<div class="tw mt12"><table><thead><tr><th>Trường</th><th>Khai báo</th><th>Đọc từ giấy tờ</th></tr></thead><tbody>'+
   bad.map(function(r){return '<tr><td>'+esc(r.f)+'</td><td>'+esc(r.v)+'</td>'+
    '<td class="mono" style="color:var(--danger)">'+esc(r.o)+'</td></tr>'}).join('')+'</tbody></table></div>'}
 return h+'</div>';
}
function ctxStrip(){
 var p=S.base,t=th();
 return '<div class="ctxstrip">'+
  '<div><span class="k">Số GCN/HĐBH</span><span class="v mono">'+esc(p.so)+'</span></div>'+
  '<div><span class="k">Sản phẩm</span><span class="v">'+esc(p.ppc)+'</span></div>'+
  '<div><span class="k">Người được bảo hiểm</span><span class="v">'+esc(tenOf(p.ndbh))+'</span></div>'+
  '<div><span class="k">Thời hạn</span><span class="v mono">'+esc(p.tu)+' — '+esc(p.den)+'</span></div>'+
  '<div class="sp"></div><div><span class="tag '+(t==='TH1'?'b':'n')+'">'+t+' — SĐBS '+
  (t==='TH1'?'trước ngày đầu hiệu lực':'sau ngày hiệu lực')+'</span></div></div>';

/* ô chỉ đọc, có đánh dấu giá trị cũ khi đã sửa */
function flD(l,o,n,mono){
 if(String(o)===String(n))return fl(l,n,mono);
 return '<div class="fl"><div class="lb">'+esc(l)+'</div><div class="ro'+(mono?' mono':'')+'">'+esc(n||'—')+'</div>'+
  '<div class="was">Trước: <s>'+esc(o||'(trống)')+'</s></div></div>';
}
var MONO={ns:1,soGt:1,sdt:1,mst:1};
function roFields(b,d,F){
 return '<div class="grid">'+F.map(function(f){
  return flD(f[1],vOf(b,f[0]),vOf(d,f[0]),MONO[f[0]])}).join('')+'</div>';
}
function roBmbh(b,d){d=d||b;return roFields(b,d,flBmbh(d))}
function roNdbh(b,d){d=d||b;return roFields(b,d,flNdbh())}
function roNth(bl,dl){dl=dl||bl;
 return dl.map(function(x,i){var b=bl[i]||x;
  return '<div class="nthcard'+(i?' mt12':'')+'"><div class="h"><span class="nm">Người thụ hưởng '+(i+1)+'</span>'+
   '<span class="tag n">'+(x.laNdbh?'Là người được bảo hiểm':esc(x.loaiKh||'Cá nhân'))+'</span></div>'+
   roFields(b,x,flNth(x).filter(function(f){return f[0]!=='laNdbh'}))+'</div>'}).join('')+
  '<div class="row mt12"><div class="sp"></div><div class="sumbar'+(tongTyLeOf(dl)===100?'':' bad')+'">'+
  'Tổng tỷ lệ: '+tongTyLeOf(dl)+'%</div></div>';
}
function tongTyLeOf(l){return l.reduce(function(a,x){return a+(Number(x.tyLe)||0)},0)}

function validate(){

  return{ok:false,bad:1,msg:'Tổng tỷ lệ thụ hưởng của mỗi Người được bảo hiểm phải bằng 100%'};
 if(S.cl.bmbh&&isCn(S.draft.bmbh)&&S.draft.bmbh.ns!==S.base.bmbh.ns&&tuoiAt(S.draft.bmbh.ns,TODAY)<18)
  return{ok:false,bad:1,msg:'Sau khi sửa, bên mua bảo hiểm chưa đủ 18 tuổi'};
 if(S.cl.nth&&S.draft.nth.some(function(x){return !x.laNdbh&&!tenOf(x)}))

function qrCells(){var s='',seed=11;
 for(var r=0;r<25;r++)for(var c=0;c<25;c++){
  var f=((r<7&&c<7)||(r<7&&c>17)||(r>17&&c<7)),on;
  if(f){var rr=r>17?r-18:r,cc=c>17?c-18:c;on=(rr===0||rr===6||cc===0||cc===6||(rr>1&&rr<5&&cc>1&&cc<5))}
  else{seed=(seed*1103515245+12345)&0x7fffffff;on=((seed>>16)&1)===1}

 return s}

function render(){
 var a=document.activeElement,aid=a&&a.id?a.id:null,pos=null;
 try{if(a&&a.selectionStart!=null)pos=a.selectionStart}catch(e){}
 $('#app').classList.toggle('collapsed',S.collapsed);
 $('#nav').innerHTML=navHtml();
 $('#roleSw').innerHTML=['cbbh','cbpd'].map(function(x){
   return '<button data-role="'+x+'" aria-pressed="'+(S.role===x?'true':'false')+'">'+(x==='cbbh'?'CBBH':'CBPD')+'</button>'}).join('');
 $('#avi').textContent=S.role==='cbbh'?'BH':'PD';
 $('#uname').textContent=S.role==='cbbh'?'lpb.cbbh01':'lpb.cbpd01';
 var crumb,title,body;
 if(S.view==='kh'){crumb='MyContract · trang khách hàng';title='Xác nhận sửa đổi bổ sung';

 else if(S.view==='detail'){crumb='Trang chủ / Quản lý đơn / <b>'+((S.base&&S.created)?esc(soMoi()):'Chi tiết')+'</b>';
  title=(S.base&&S.created)?soMoi():'Quản lý đơn';
  body=(S.base&&S.created)?detail()
   :'<div class="card"><div class="cb"><div class="alert b"><span class="ai">i</span><div>Chưa có đơn SĐBS nào.</div></div></div></div>';}
 else if(S.view==='list'){crumb='Trang chủ / <b>Quản lý đơn</b>';title='Quản lý đơn';body=listView();}
 else{var rv=S.base&&changes().length>0;
  title=rv?'Xem lại yêu cầu SĐBS':'Tạo yêu cầu SĐBS';
  crumb='Trang chủ / Quản lý đơn / <b>'+title+'</b>';body=editorView();}
 $('#crumb').innerHTML=crumb;$('#ptitle').textContent=title;$('#content').innerHTML=body;
 $('#bar').innerHTML=barHtml();
 $('#ovls').innerHTML=editPopView()+doneView()+apprView()+blockView();$('#pp').innerHTML=ppHtml();
 $('#pp').classList.toggle('hid',!S.pp);$('#ppOpen').classList.toggle('hid',S.pp);
 if(aid){var el=document.getElementById(aid);if(el){el.focus();try{if(pos!=null&&el.setSelectionRange)el.setSelectionRange(pos,pos)}catch(e){}}}

/* ================= hành vi ================= */
function pick(k){
 S.key=k;var p=SEED[k];
 S.base=clone(p);S.draft=clone(p);
 S.cl={bmbh:false,ndbh:false,nth:false,ctbh:false,thbh:false};S.docs={};S.ocr=null;
 S.open={bmbh:false,ndbh:false,nth:false};S.edit=null;S.snap=null;S.pop=null;S.locked=false;
}
function kdau(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}
function nAdv(){return (S.fCccd?1:0)+(S.fTen?1:0)}
function listRows(){
 return KEYS.filter(function(k){var p=SEED[k];
  if(S.fSp&&p.sp!==S.fSp)return false;
  if(S.fDon&&p.tthaiDon!==S.fDon)return false;
  if(S.fTt&&p.tthaiTt!==S.fTt)return false;
  if(S.fHd&&String(p.so).toUpperCase().indexOf(S.fHd.toUpperCase())<0)return false;
  if(S.adv){
   var sp2=function(x){return String(x||'').replace(/\s/g,'')};
   if(S.fCccd){var q=sp2(S.fCccd);
    if(sp2(p.bmbh.soGt).indexOf(q)<0&&sp2(p.bmbh.mst).indexOf(q)<0&&sp2(p.ndbh.soGt).indexOf(q)<0)return false}
   if(S.fTen){var t2=kdau(S.fTen);
    if(kdau(tenOf(p.bmbh)).indexOf(t2)<0&&kdau(tenOf(p.ndbh)).indexOf(t2)<0)return false}
  }
  return true});
}
function mcv(kind){
 var c=$('#content');if(!c)return;
 var n=document.createElement('div');n.className='card';n.style.marginTop='16px';
 n.innerHTML='<div class="cb"><div class="alert o"><span class="ai">→</span><div><b>Đã tạo yêu cầu MCV '+esc(S.base.so)+'/MCV01.</b> '+
  esc(kind)+' Hồ sơ chuyển bộ phận nghiệp vụ PTI xử lý thủ công, luồng tự động dừng tại đây.</div></div></div>';
 c.appendChild(n);n.scrollIntoView({behavior:'smooth',block:'center'});
}
function openCode(r){
 if(!r)return;S.popWho=r;S.kh[r].code='';S.kh[r].err='';S.pop='code';render();
 var f=document.querySelector('.hc[data-i="0"]');f&&f.focus();
}
function submitCode(r){
 var k=S.kh[r];
 if(k.code==='123456'){k.res='confirmed';k.err='';return}
 k.tries++;k.code='';
 if(k.tries>=5){k.res='cancelled';k.err='';S.cancel='Nhập sai mã xác thực quá số lần cho phép'}
 else k.err='Mã xác thực không đúng. Còn '+(5-k.tries)+' lần thử.';
}
document.addEventListener('click',function(e){
 var t=e.target.closest('button,[data-up],[data-acc],tr[data-row]');if(!t)return;var d=t.dataset||{};
 if(t.id==='btnCollapse'){S.collapsed=!S.collapsed;render();return}
 if(t.id==='btnTheme'){var rt=document.documentElement;
  var dk=rt.getAttribute('data-theme')==='dark'||(!rt.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
  rt.setAttribute('data-theme',dk?'light':'dark');return}
 if(t.id==='ppClose'){S.pp=false;render();return}
 if(t.id==='ppOpen'){S.pp=true;render();return}
 if(d.nav){if(d.nav==='home')return;S.view=d.nav;render();window.scrollTo({top:0});return}
 if(t.id==='advTog'){S.adv=!S.adv;if(!S.adv){S.fCccd='';S.fTen=''}render();return}
 if(t.hasAttribute('data-q')){S.adv=true;S.fCccd=d.q;S.fSp='Bệnh hiểm nghèo';S.fDon='';S.fTt='';S.fHd='';S.view='list';render();return}
 if(d.sdbs){
  if(!eligible(SEED[d.sdbs],S.ngayCap)){S.block=d.sdbs;render();return}
  pick(d.sdbs);S.view='wizard';S.created=false;S.locked=false;render();window.scrollTo({top:0});return}
 if(t.id==='blkOk'||t.id==='blkX'){S.block=null;render();return}
 if(d.up){S.docs[d.up]=!S.docs[d.up];render();return}
 if(d.undo){set(S.draft,d.undo,get(S.base,d.undo));render();return}
 if(d.clreset){resetCluster(d.clreset);render();return}
 if(t.id==='rstAll'){S.confirmReset=true;render();return}
 if(t.id==='rstNo'){S.confirmReset=false;render();return}
 if(t.id==='rstYes'){S.draft=clone(S.base);S.cl={bmbh:false,ndbh:false,nth:false,ctbh:false,thbh:false};
  S.confirmReset=false;render();return}
 if(t.id==='toMcv'){S.edit=null;render();mcv(chenh()<0?'Phí chênh lệch âm.':'Thông tin khai báo không khớp giấy tờ gốc.');return}
 if(d.acc){S.open[d.acc]=!S.open[d.acc];render();return}
 if(d.pen){var k=d.pen;S.edit=k;S.cl[k]=true;S.open[k]=true;
  S.snap={k:k,cl:clone(S.cl),data:clone(S.draft[k==='nth'?'nth':k])};render();return}
 if(t.id==='edX'||t.id==='edCancel'){
  if(S.snap){S.cl=S.snap.cl;S.draft[S.snap.k==='nth'?'nth':S.snap.k]=S.snap.data;S.snap=null}
  S.edit=null;render();return}
 if(t.id==='edOk'){S.snap=null;S.edit=null;render();window.scrollTo({top:0});return}
 if(t.id==='nthAdd'){S.draft.nth.push({loaiKh:'Cá nhân',laNdbh:false,hoTen:'',tenDn:'',mst:'',soGt:'',
  diaChi:'',email:'',sdt:'',gioiTinh:'Nam',ns:'01/01/1990',tyLe:0});render();return}
 if(d.nthdel!==undefined){S.draft.nth.splice(+d.nthdel,1);render();return}
 if(t.id==='askOpen'){S.locked=true;S.created=true;S.pop='done';render();return}
 if(t.id==='doneCode'){openCode(conHo()[0]);return}
 if(t.id==='doneList'){S.pop=null;S.view='list';render();window.scrollTo({top:0});return}
 if(t.id==='popX'||t.id==='popX2'){S.pop=null;if(S.view!=='detail')S.view='detail';render();return}
 if(t.id==='codeBack2'){S.pop=S.view==='detail'?null:'done';render();return}
 if(t.id==='codeOk'){submitCode(S.popWho);
  if(S.kh[S.popWho].res==='confirmed')S.pop='ok';
  else if(S.kh[S.popWho].res){S.pop=null;S.view='detail'}
  render();return}
 if(d.appr){S.appr=true;render();return}
 if(t.id==='openAppr'){S.appr=true;render();return}
 if(t.id==='apX'||t.id==='apX2'){S.appr=false;render();return}
 if(d.role){S.role=d.role;S.appr=false;
  if(S.view==='wizard'&&d.role==='cbpd')S.view=S.created?'detail':'list';render();return}
 if(d.helpcode){openCode(d.helpcode);return}
 if(d.khwho){S.khWho=d.khwho;render();return}
 if(t.id==='khYes'){S.kh[S.khWho].stage='code';S.kh[S.khWho].code='';S.kh[S.khWho].err='';render();return}
 if(t.id==='khNo'){S.kh[S.khWho].res='rejected';S.cancel='Khách hàng từ chối nội dung sửa đổi';render();return}
 if(t.id==='codeBack'){S.kh[S.khWho].stage='consent';render();return}
 if(t.id==='codeGo'){submitCode(S.khWho);render();return}
 if(t.id==='toggleQr'){S.showQr=!S.showQr;render();return}
 if(t.id==='doIssue'){S.issued=true;render();return}
 if(t.id==='gcnSla'){S.gcnDone=true;render();return}
 if(t.id==='apprYes'){S.cbpd='approved';S.cbpdNote=($('#cbpdNote')&&$('#cbpdNote').value)||'Hồ sơ đầy đủ, nội dung khớp giấy tờ gốc.';
  S.appr=false;S.view='detail';render();return}
 if(t.id==='apprNo'){S.cbpd='rejected';S.cbpdNote=($('#cbpdNote')&&$('#cbpdNote').value)||'Nội dung sửa đổi chưa đủ căn cứ.';
  S.cancel='CBPD từ chối phê duyệt';S.appr=false;S.view='detail';render();return}
 if(t.id==='apprLate'){S.cbpd='rejected';S.cbpdNote='Quá hạn phê duyệt';S.cancel='Quá hạn phê duyệt';render();return}
 if(t.id==='apprUndo'){S.cbpd=null;S.cbpdNote='';if(S.cancel==='CBPD từ chối phê duyệt'||S.cancel==='Quá hạn phê duyệt')S.cancel=null;render();return}
 if(d.sim){sim(d.sim);return}
});
function sim(k){
 if(k==='v-list')S.view='list';
 else if(k==='v-detail')S.view='detail';
 else if(k==='v-cbpd'){S.role='cbpd';S.view=S.created?'detail':'list'}
 else if(k==='v-kh')S.view='kh';
 else if(k==='wrongdob'){if(S.draft){S.cl.ndbh=true;S.open.ndbh=true;S.draft.ndbh.ns='12/08/1985'}}
 else if(k==='docs'){reqDocs().forEach(function(d){for(var j=0;j<d.n;j++)S.docs[d.id+'-'+j]=true})}
 else if(k==='kh-ok'){recipients().forEach(function(r){S.kh[r].res='confirmed'});S.cancel=null}
 else if(k==='kh-late'){S.cancel='Quá hạn xác nhận'}
 else if(k==='ap-ok'){S.cbpd='approved';S.cbpdNote='Hồ sơ đầy đủ, nội dung khớp giấy tờ gốc.'}
 else if(k==='pay')S.pay='paid';
 else if(k==='reset'){var pp=S.pp,co=S.collapsed;fresh();S.pp=pp;S.collapsed=co}
 render();
}
document.addEventListener('change',function(e){
 var el=e.target,d=el.dataset||{};
 if(d.nthw!==undefined){var ix=+d.nthw,x=S.draft.nth[ix];x.laNdbh=(el.value==='1');
  if(x.laNdbh){x.hoTen=S.draft.ndbh.hoTen;x.soGt=S.draft.ndbh.soGt;x.diaChi=S.draft.ndbh.diaChi;
   x.loaiKh='Cá nhân';x.tenDn='';x.mst=''}
  render();return}
 if(d.cl!==undefined){S.cl[d.cl]=el.checked;if(!el.checked)resetCluster(d.cl);render();return}
 if(el.id==='fSp'){S.fSp=el.value;render();return}
 if(el.id==='fDon'){S.fDon=el.value;render();return}
 if(el.id==='fTt'){S.fTt=el.value;render();return}
 if(el.id==='cm1'){S.kh[S.khWho].cm1=el.checked;render();return}
 if(el.id==='cm2'){S.kh[S.khWho].cm2=el.checked;render();return}
 if(el.id==='cbpdNote'){S.cbpdNote=el.value;return}
 if(d.date){set(S.draft,d.path,fd(fromIso(el.value)));render();return}
 if(d.path&&el.tagName==='SELECT'){set(S.draft,d.path,el.value);render();return}
});
document.addEventListener('input',function(e){
 var el=e.target,d=el.dataset||{};
 if(el.classList.contains('cd1')||el.classList.contains('hc')){
  var help=el.classList.contains('hc'),who=help?S.popWho:S.khWho,cls=help?'hc':'cd1';
  el.value=el.value.replace(/[^0-9A-Za-z]/g,'').slice(0,1).toUpperCase();
  if(el.value&&+d.i<5){var nx=document.querySelector('.'+cls+'[data-i="'+(+d.i+1)+'"]');nx&&nx.focus()}
  S.kh[who].code=Array.prototype.map.call(document.querySelectorAll('.'+cls),function(x){return x.value}).join('');
  var gb=document.getElementById('codeGo')||document.getElementById('codeOk');
  if(gb)gb.disabled=(S.kh[who].code.length!==6);
  return}
 if(el.id==='fHd'){S.fHd=el.value;render();return}
 if(el.id==='fCccd'){S.fCccd=el.value;render();return}
 if(el.id==='fTen'){S.fTen=el.value;render();return}
 if(!d.path||d.date)return;
 var v=el.value,sig0=docSig();
 if(/\.tyLe$/.test(d.path))v=el.value===''?0:Number(el.value.replace(/\D/g,''));
 set(S.draft,d.path,v);
 if(docSig()!==sig0){render();return}
 var w=document.getElementById('w-'+pid(d.path));if(w)w.innerHTML=wasHtml(d.path);
 if(/\.tyLe$/.test(d.path)){render();return}
 var ck=d.path.split('.')[0],cn=document.getElementById('cnt-'+ck);
 if(cn){var nn=ck==='bmbh'?cntBmbh():ck==='ndbh'?cntNdbh():cntNth();
  cn.textContent=nn+' trường sửa đổi';cn.hidden=!nn}
 $('#bar').innerHTML=barHtml();
 var ef=document.getElementById('edFoot');if(ef)ef.innerHTML=edFootHtml();
});
function resetCluster(k){
 if(k==='bmbh')S.draft.bmbh=clone(S.base.bmbh);
 if(k==='ndbh')S.draft.ndbh=clone(S.base.ndbh);
 if(k==='nth')S.draft.nth=clone(S.base.nth);
}
document.addEventListener('keydown',function(e){
 if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.up){e.preventDefault();e.target.click()}
 var cl=e.target.classList;
 if(e.key==='Backspace'&&cl&&(cl.contains('cd1')||cl.contains('hc'))&&!e.target.value){
  var c=cl.contains('hc')?'hc':'cd1',i=+e.target.dataset.i;
  if(i>0){var p=document.querySelector('.'+c+'[data-i="'+(i-1)+'"]');p&&p.focus()}}
});

render();
})();
</script>
